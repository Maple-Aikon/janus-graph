[project]
name = "janus-graph"
version = "0.1.0"
description = "Modular, Resilient Knowledge Graph Memory Engine for AI Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Maple Aikon", email = "maple@localhost" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "graphiti-core[falkordb]>=0.20",
    "falkordb>=0.1.7",
    "httpx>=0.27",
    "tenacity>=9.0",
    "numpy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = [
    "rich>=13.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.5.0",
]

[project.scripts]
janus-graph = "janus_graph.cli.main:cli_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus_graph"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "data",
    "bin",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
