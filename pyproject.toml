[project]
name = "janus-graph"
version = "0.1.0"
description = "Modular, Resilient Knowledge Graph Memory Engine for AI Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Maple Aikon", email = "maple@localhost" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    # PINNED 2026-10-10: was `>=0.20`, which let any future release silently
    # change retrieval/scoring behaviour under a live KG. Lock to the version
    # that was actually tested (and is already installed / already in uv.lock).
    # Bump deliberately, with a re-run of the search gold-set harness.
    "graphiti-core[falkordb]==0.30.1",
    "falkordb>=0.1.7",
    "httpx>=0.27",
    "tenacity>=9.0",
    "numpy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
cli = [
    "rich>=13.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff==0.16.5",  # pinned: ruff format output changes between minors, CI gates on it
    "mypy==2.4.0",  # pinned: new mypy minors add error codes and can turn a green gate red
]

[project.scripts]
janus-graph = "janus_graph.cli.main:cli_entrypoint"
janus-graph-daemon = "janus_graph.daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus_graph"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "data",
    "bin",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to import a symbol purely to assert it still exists or to
# freeze an interface contract (tests/test_contracts.py imports 12 dataclasses
# and references none of them -- that IS the test). `ruff check --fix` would
# delete those imports and silently gut the assertion, so these are suppressed
# as POLICY rather than fixed as code.
#
# The same reasoning covers F841: a local assigned but never read is sometimes
# the whole point (binding the result of a call that must not raise).
#
# I001 is listed for durability -- the suite is sorted today, and if a future
# edit leaves an unsorted import in a fixture or conftest the intent is to keep
# it, not to churn the file.
"tests/**" = ["F401", "F841", "I001"]

[tool.mypy]
python_version = "3.12"
files = ["janus_graph"]
# Scope is the shipped package only. `tests/` carries its own 13 errors today
# (42 total / 18 files when included) and test files are full of deliberate
# `# type: ignore[assignment]` and MagicMock stand-ins that are not type
# assertions. Gating them would block CI on intentional test doubles.

# ── import suppressions ────────────────────────────────────────────────────
# Deliberately PER-MODULE, not a blanket `ignore_missing_imports = true`.
# Blanket was measured to give the identical rc=0, but it also silences import
# checking for every future dependency, so a genuinely missing package would
# pass unnoticed. These three ship no type information:
#   - falkordb 1.7.1  -> installed, but no py.typed marker
#   - graphiti_core   -> installed, but no py.typed marker
#   - yaml            -> real stubs live in types-PyYAML, which is not a
#                        runtime dep; adding it only for the checker would
#                        grow the dependency tree for no runtime benefit.
[[tool.mypy.overrides]]
module = "falkordb"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "graphiti_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# ── known-debt suppressions ────────────────────────────────────────────────
# Each module below has a measured, pre-existing type error. They are suppressed
# so the gate can start GREEN today and catch NEW errors from here on.
#
# THIS LIST IS DEBT TRACKING, NOT DEBT CLEARING. Do not add a module here to
# silence something you just wrote. Remove a line once its module is clean.
#
# !! janus_graph.daemon.falkordb_supervisor WAS on this list, and its entry
# !! was deleted 2026-10-10 after the bug it was flagged for was fixed.
# !!
# !! What the gate had found there: `_probe_redis` was annotated `-> bool`
# !! but returned `ProbeState`, a `str`-Enum whose members are ALL truthy.
# !! So `probe()` returned a truthy <ProbeState.DEAD> when the engine was
# !! dead — and the circuit breaker then called `record_success()` instead
# !! of `record_failure()`.
# !!
# !! Production impact, since fixed (reached from daemon/http_server.py:114
# !! `/health` `falkor_ok`, and daemon/http_search_memory_handler.py:267):
# !!   * /health answered status="ready" with falkor_ok="dead" while the
# !!     engine was unreachable;
# !!   * the 503 FALKOR_DISCONNECTED branch was unreachable dead code,
# !!     because `if not falkor_ok` never fired for a truthy enum.
# !!
# !! Fix: `_probe_redis` now declares `-> ProbeState` and both call sites
# !! compare with `is ProbeState.ALIVE`; WARMING_UP still leaves the breaker
# !! untouched per the module contract. Regression tests in
# !! tests/test_falkordb_restart_policy.py (verified failing on the old code).
# !!
# !! Do NOT re-add this module to silence a new error — it is gated again.
# !!
# !! janus_graph.pipeline.cron + janus_graph.pipeline.worker were removed from
# !! this list the same day (7 errors: cron 38/46/54/62/74, worker 54/69).
# !! TWO of those were live crashes, not type noise:
# !!
# !!   1. cron.py:46/54/62 — `float(getattr(cfg.pipeline,
# !!      "attempt_timeout_sec", None))` was guarded by `hasattr`, but
# !!      hasattr is True whenever the attribute EXISTS, even when its value
# !!      is None. pydantic accepts a post-hoc
# !!      `cfg.pipeline.attempt_timeout_sec = None` (validate_assignment is
# !!      unset), so the guard passed and float(None) raised TypeError inside
# !!      run_cron_sweep — an unhandled crash of the whole sweep, not a
# !!      per-episode failure. Reproduced 2026-10-10 on both the post-hoc
# !!      assignment and model_construct paths.
# !!
# !!   2. cron.py:74 — `getattr(cfg.paths, "queue_db_path", None)`. The getattr
# !!      guards the INNER attribute only; `cfg.paths` is evaluated eagerly and
# !!      JanusSettings has no `paths` field at all, so the "defence-in-depth"
# !!      fallback raised AttributeError instead of falling back. It was
# !!      unreachable today only because line 72 already returns a path for
# !!      every JanusSettings.
# !!
# !! Both now read through getattr with an explicit `is not None` test, so a
# !! missing OR None value falls back instead of crashing. Regression tests in
# !! tests/test_cron_settings_union.py (verified failing on the old code).
# !!
# !! The other three were type-only — proven unreachable, not assumed:
# !! cron.py:38 needs a contracts.Settings AND batch_size=None (every
# !! production caller passes a JanusSettings; tests pin batch_size=5);
# !! worker.py:54's settings.graphiti fallback is dead because BOTH payload
# !! writers (queue.enqueue and daemon/episode_queue_adapter) always write
# !! group_id; worker.py:69 needs a contracts.Settings reaching an UNPATCHED
# !! create_graphiti_instance, which no caller does. Those two use `cast`, an
# !! identity function at runtime, so the AttributeError each would raise —
# !! and should_retry's classification of it (AttributeError → retry,
# !! measured) — is unchanged.
# !!
# !! Do NOT re-add these modules to silence a new error — they are gated again.
